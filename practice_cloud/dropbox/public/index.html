<!DOCTYPE html>
<html>
<head>
    <title>Student Document Storage</title>
    <style>
        body {
            font-family: Arial;
            background: #eef5ff;
            text-align: center;
            padding: 60px;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 400px;
            margin: auto;
            border-radius: 12px;
        }

        button {
            background: #1769e0;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Student Document Storage</h2>
        <p>Upload your certificates and documents to Dropbox.</p>

        <form action="/upload" method="POST"
              enctype="multipart/form-data">
            <input type="file" name="file" required>
            <br>
            <button type="submit">Upload to Dropbox</button>
        </form>
    </div>
</body>
</html>
